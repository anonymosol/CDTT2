openapi: 3.1.0
info:
  title: Boardgame Advisor API
  version: 0.1.0
  description: >
    Initial API contract scaffold. Agree on request and response schemas as a
    team before implementing endpoints.
servers:
  - url: http://localhost:3000
    description: Local development
paths: 
  /api/games:
    get:
      sumary: List avalaible boardgames
      responses:
        '200':
         description: A list of boardgames
         content:
           application/json:
             schema:
               type: array
               items:
                 $ref: '#/components/schemas/Game'

components:
  schemas:
    Game:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name: 
          type: string
        minPlayers:
          type: integer
        maxPlayers:
          type: integer
        duration:
          type: integer