name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cài dependency
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Kiểm tra kiểu (TypeScript)
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
